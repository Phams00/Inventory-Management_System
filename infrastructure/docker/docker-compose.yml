
name: ims

services:
  postgres:
    image: postgres:16-alpine
    container_name: ims-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ims_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ims_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ims_db}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - ims_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ims_user} -d ${POSTGRES_DB:-ims_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ims_postgres_data:
